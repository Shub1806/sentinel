<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="5">{% endif %}
<title>{% block title %}sentinel agent{% endblock %}</title>
<style>
:root {
  --bg: #ffffff; --fg: #0a0a0a; --muted: #6b6b6b; --line: #d4d4d4; --panel: #f4f4f4;
  --bad: #0a0a0a; --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a0a0a; --fg: #f2f2f2; --muted: #8a8a8a; --line: #2e2e2e; --panel: #151515; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono); }
a { color: inherit; }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
         padding: 14px 20px; border-bottom: 1px solid var(--fg); }
header .brand { font-weight: 700; letter-spacing: .04em; text-decoration: none; }
header .meta { color: var(--muted); font-size: 12px; }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
     margin: 28px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top;
         overflow-wrap: anywhere; }
th { font-size: 12px; color: var(--muted); font-weight: 400; text-transform: uppercase; }
tr.row:hover td { background: var(--panel); }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--fg); font-size: 12px; white-space: nowrap; }
.tag.firing, .tag.failed { background: var(--fg); color: var(--bg); }
.tag.rejected { text-decoration: line-through; }
.tag.running, .tag.queued { border-style: dashed; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; }
.report .summary { font-size: 16px; margin: 0 0 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.action { border: 2px solid var(--fg); padding: 12px 14px; margin-top: 14px; }
.action .kind { font-weight: 700; }
.warn { border: 2px dashed var(--fg); padding: 6px 8px; }
ol.steps { padding-left: 28px; margin: 0; }
ol.steps li { margin-bottom: 8px; }
code, pre { font-family: var(--mono); }
pre { white-space: pre-wrap; word-break: break-word; background: var(--panel); border: 1px solid var(--line);
      padding: 8px; margin: 6px 0 0; max-height: 320px; overflow: auto; font-size: 12px; }
details summary { cursor: pointer; color: var(--muted); }
pre.postmortem { max-height: none; font-size: 13px; line-height: 1.55; }
form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input, button { font: inherit; padding: 4px 8px; border: 1px solid var(--fg); background: var(--bg); color: var(--fg); }
button { cursor: pointer; background: var(--fg); color: var(--bg); }
button.secondary { background: var(--bg); color: var(--fg); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
@media (max-width: 700px) { .hide-narrow { display: none; } main { padding: 16px; } th, td { padding: 6px 4px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">sentinel // on-call agent</a>
  <span class="meta">model: {{ settings.llm_model or "off" }} · watching: {{ settings.namespace }} · times in UTC{% if refresh %} · refreshing every 5 s{% endif %}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
