spring.application.name=orders

# ---------- Database ----------
# Defaults match compose.yaml. In Kubernetes these come from env vars and Secrets.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/orders}
spring.datasource.username=${DB_USER:sentinel}
spring.datasource.password=${DB_PASSWORD:}
# Small pool on purpose: the "connection pool exhausted" chaos scenario uses this.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

# Flyway creates the tables; Hibernate only checks the Java code matches them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Redpanda (Kafka API) ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

# ---------- Health checks ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
