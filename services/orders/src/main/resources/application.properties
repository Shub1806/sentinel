spring.application.name=orders

# ---------- Database ----------
# Defaults match compose.yaml. In Kubernetes these come from env vars and Secrets.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/orders}
spring.datasource.username=${DB_USER:sentinel}
spring.datasource.password=${DB_PASSWORD:}
# Small pool on purpose: the "connection pool exhausted" chaos scenario uses this.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

# Flyway creates the tables; Hibernate only checks the Java code matches them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Redpanda (Kafka API) ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

# ---------- Health checks ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Record request durations in histogram buckets, so Prometheus can calculate p95/p99 latency for the SLOs.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Exact bucket edges at the SLO thresholds; the default edges are odd numbers like 0.268435456 s.
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms

# ---------- Tracing ----------
# Trace every request (the default is 10%). Traces are only sent when an OTLP endpoint is set,
# which happens in Kubernetes (infra/helm-values/orders.yaml).
management.tracing.sampling.probability=1.0
# Put a trace header on each Kafka message, so payments can continue the trace.
spring.kafka.template.observation-enabled=true
# Prometheus already scrapes the metrics; don't also push them over OTLP.
management.otlp.metrics.export.enabled=false

# ---------- Logging ----------
# One JSON object per line (Logstash format, with a "level" field like the other services),
# so Loki can parse it. The startup banner would only add plain-text lines.
logging.structured.format.console=logstash
spring.main.banner-mode=off

# ---------- API ----------
# Return errors in the standard "problem details" JSON format (RFC 9457).
spring.mvc.problemdetails.enabled=true
# Reject 19.99 for a whole-number field instead of silently turning it into 19.
spring.jackson.deserialization.accept-float-as-int=false


# ---------- Outbox relay ----------
outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
outbox.relay.interval-ms=${OUTBOX_RELAY_INTERVAL_MS:500}
outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:100}

# Producer: wait for Redpanda to confirm, never write duplicates on retry,
# and give up after a few seconds if Redpanda is down (the relay retries later).
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
