# Local development dependencies for Sentinel.
# Start:  docker compose up -d
# Stop:   docker compose down        (keeps data)
# Reset:  docker compose down -v     (deletes data)

services:
  postgres:
    image: postgres:18
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "15432:5432"
    volumes:
      # Postgres 18 stores data under /var/lib/postgresql (changed from earlier versions)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.9
    container_name: sentinel-redpanda
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"   # Kafka API for apps running on your Mac
      - "19644:9644"    # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: docker.redpanda.com/redpandadata/console:v3.7.3
    container_name: sentinel-console
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    ports:
      - "8090:8080"     # 8090 on your Mac, so 8080 stays free for the orders service
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.9
    container_name: sentinel-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    # Creates the topics once; "already exists" errors are fine on later runs
    command: -c "rpk topic create order.created payment.done --partitions 3 -X brokers=redpanda:9092 || true"
    restart: "no"  

  localstack:
    # Pinned version (LocalStack uses year.month versions). Requires a free account token.
    image: localstack/localstack:2026.10.0
    container_name: sentinel-localstack
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env}
      # Only start the AWS services we use, which saves memory
      SERVICES: s3,sqs,secretsmanager
    ports:
      - "4566:4566"     # one port for all emulated AWS services
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
            test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=3)"]
            interval: 10s
            timeout: 5s
            retries: 10

  # ---------- Sentinel services (start with: docker compose --profile apps up -d) ----------
  orders:
    profiles: ["apps"]
    build: ./services/orders
    image: sentinel/orders:dev
    container_name: sentinel-orders
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  payments:
    profiles: ["apps"]
    build: ./services/payments
    image: sentinel/payments:dev
    container_name: sentinel-payments
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8001:8001"
    mem_limit: 256m
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  notifications:
    profiles: ["apps"]
    build: ./services/notifications
    image: sentinel/notifications:dev
    container_name: sentinel-notifications
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      AWS_ENDPOINT_URL: http://localstack:4566
      # LocalStack accepts any credentials; these are not secrets.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8002:8002"
    mem_limit: 256m
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

volumes:
  postgres-data:
  redpanda-data:
