# Values for the notifications service (chart: infra/charts/sentinel-service).
image:
  repository: sentinel/notifications
  tag: dev

port: 8002

env:
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  AWS_ENDPOINT_URL: http://localstack:4566
  # LocalStack accepts any credentials; these are not secrets.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  # Send traces to Tempo (OTLP over HTTP).
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo.tracing.svc.cluster.local:4318/v1/traces
  OTEL_SERVICE_NAME: notifications

metrics:
  enabled: true
  path: /metrics
