# Values for the payments service (chart: infra/charts/sentinel-service).
image:
  repository: sentinel/payments
  tag: dev

port: 8001

env:
  # Same namespace, so the short Service name works.
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  # Send traces to Tempo (OTLP over HTTP).
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo.tracing.svc.cluster.local:4318/v1/traces
  OTEL_SERVICE_NAME: payments


# Scale on CPU, up to 3 pods: order.created has 3 partitions, and a 4th consumer would sit idle.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70


metrics:
  enabled: true
  path: /metrics
