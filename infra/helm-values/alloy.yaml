# Grafana Alloy (grafana/alloy chart 1.13.1, Alloy v1.20.1): ships pod logs to Loki.
# Installed by Terraform (infra/terraform/platform/logging.tf).
# Logs are read through the Kubernetes API, so one pod is enough and no host folders are mounted.

controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi
  configMap:
    content: |-
      // Find every pod in the sentinel namespace.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["sentinel"]
        }
      }

      // Turn Kubernetes metadata into a few Loki labels (kept small on purpose).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // app = the app.kubernetes.io/name label, or the container name if a pod has none.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
          regex         = "^;(.+)$|^([^;]+);.*$"
          replacement   = "$1$2"
          target_label  = "app"
        }
      }

      // Read the logs through the Kubernetes API.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
