# kube-prometheus-stack (chart 92.10.1) for a single-node local k3d cluster.
# Installed by Terraform (infra/terraform/platform/monitoring.tf).

# k3s runs the scheduler, controller-manager, proxy and etcd inside one process and
# doesn't expose them separately. Without this, Prometheus would report them "down"
# and fire false alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
  disabled:
    # Docker Desktop's VM takes its time from the Mac, not NTP, so the kernel always
    # reports "not synchronised". NodeClockSkewDetected still alerts on real clock drift.
    NodeClockNotSynchronising: true
    # On Docker Desktop, rule groups sometimes run twice at the same timestamp
    # ("different value but same timestamp" in the Prometheus log), and Prometheus
    # counts the catch-up as a missed run. CPU is idle and every group runs in ms,
    # so this alert only produces false alarms here.
    PrometheusMissingRuleEvaluations: true

prometheus:
  prometheusSpec:
    # By default Prometheus only watches monitoring configs made by this chart.
    # These let it pick up the ones our own services will add, in any namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 2d          # keep 2 days of data: plenty for local dev
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  # Only route and receivers are set here; the chart's other defaults (global settings,
  # inhibit rules, templates) are kept. Lists replace the chart's lists, so the Watchdog
  # route is repeated.
  config:
    route:
      receiver: "null"
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname="Watchdog"
        # Everything about the sentinel namespace goes to the on-call agent: our own rules
        # (they all carry namespace: sentinel) and the chart's Kubernetes alerts for its pods.
        # One incident per alert name; changes are sent within a minute.
        - receiver: agent
          matchers:
            - namespace="sentinel"
          group_by: [namespace, alertname]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 4h
    receivers:
      - name: "null"
      - name: agent
        webhook_configs:
          - url: http://agent.agent.svc.cluster.local:8003/alerts
            send_resolved: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  # No adminPassword here on purpose: the Grafana chart generates a random one
  # and stores it in a Kubernetes Secret.
  defaultDashboardsTimezone: browser
  # Loki (logging namespace) and Tempo (tracing namespace). Fixed uids let dashboards and links refer to them.
  # "$$" keeps Grafana from reading ${...} as an environment variable when it loads these settings.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.logging.svc.cluster.local:3100
      access: proxy
      jsonData:
        # A trace id in a log line becomes a "View trace" link to Tempo.
        # orders logs "traceId"; payments and notifications log "trace_id".
        derivedFields:
          - name: TraceID
            matcherType: regex
            matcherRegex: '"(?:traceId|trace_id)":\s*"([0-9a-f]{32})"'
            url: '$${__value.raw}'
            datasourceUid: tempo
            urlDisplayLabel: View trace
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.tracing.svc.cluster.local:3200
      access: proxy
      jsonData:
           # Each span gets a "Logs for this span" link: every sentinel log line with the span's trace id.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: '-5m'
          spanEndTimeShift: '5m'
          customQuery: true
          query: '{namespace="sentinel"} |= "$${__trace.traceId}"'
prometheus-node-exporter:
  # Docker-based nodes (like k3d's) can't support this mount; leaving it on stops the exporter starting.
  hostRootFsMount:
    enabled: false
